# Raspberry Pi 5 runtime. Provide secrets via a root-owned 0600 .env (env_file),
# never baked into the image. The API is bound to localhost only — front it with
# Tailscale / a reverse proxy if remote access is needed.
services:
  qaia:
    build: .
    image: qaia:local
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
