# Cross-build the arm64 image, push to GHCR, then SSH-deploy to the Pi.
# Configure first: a protected "production" Environment with secrets
#   SSH_HOST, SSH_USER, SSH_KEY (deploy-only key), and SSH_HOST_FINGERPRINT.
# SSH_HOST_FINGERPRINT : empreinte « SHA256:... » de la clé d'hôte ECDSA du Pi, celle que
# négocie appleboy/ssh-action, passée à son paramètre fingerprint. Jusqu'au 24/09/2026, cet
# en-tête demandait SSH_KNOWN_HOSTS et fingerprint recevait ce secret. C'était faux : le
# paramètre attend une seule empreinte et non des lignes au format known_hosts. Vide, ce
# secret désactivait la vérification en silence ; rempli, il la faisait échouer.
# Networking to a homelab Pi is a DEFERRED decision (PLAN §13) — e.g. Tailscale.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}

      - name: Vérifier que l'empreinte du Pi est configurée
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          if [ -z "$SSH_HOST_FINGERPRINT" ]; then
            echo "::error::Secret SSH_HOST_FINGERPRINT absent : sans lui, le déploiement accepterait n'importe quel hôte."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1, soit v1.2.5 au 24/09/2026
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Sans empreinte, l'action accepte n'importe quel hôte : l'étape précédente l'exige.
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            cd ~/qaia
            docker compose pull
            docker compose up -d
