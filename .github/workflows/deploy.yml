# Cross-build the arm64 image, push to GHCR, then SSH-deploy to the Pi.
# Configure first: a protected "production" Environment with secrets
#   SSH_HOST, SSH_USER, SSH_KEY (deploy-only key), and SSH_HOST_FINGERPRINT.
# SSH_HOST_FINGERPRINT : empreinte « SHA256:... » de la clé d'hôte ECDSA du Pi, celle que
# négocie appleboy/ssh-action, passée à son paramètre fingerprint. Jusqu'au 24/09/2026, cet
# en-tête demandait SSH_KNOWN_HOSTS et fingerprint recevait ce secret. C'était faux : le
# paramètre attend une seule empreinte et non des lignes au format known_hosts. Vide, ce
# secret désactivait la vérification en silence ; rempli, il la faisait échouer.
# Networking to a homelab Pi is a DEFERRED decision (PLAN §13) — e.g. Tailscale.
name: deploy

# SUSPENDU le 25/09/2026 : déclenchement manuel seulement. Déclenché à chaque push sur main,
# il échouait à chaque fois, sans rien pouvoir déployer :
#   - le nom d'image reprenait github.repository tel quel (« gotyeah-QAIA »), que GHCR refuse
#     parce qu'il exige des minuscules (corrigé plus bas) ;
#   - aucune cible n'existe sur le Pi (pas de ~/qaia, aucun conteneur qaia) ;
#   - ni l'environnement « production » ni le dépôt ne portent SSH_HOST, SSH_USER et SSH_KEY
#     (seuls SSH_HOST_FINGERPRINT et SSH_KNOWN_HOSTS existent) ;
#   - l'accès du runner au Pi reste une décision différée (PLAN §13).
# Pour le réactiver :
#   1. trancher l'accès au Pi (PLAN §13) et poser SSH_HOST, SSH_USER et SSH_KEY (une clé
#      dédiée au déploiement) dans l'environnement « production » ;
#   2. sur le Pi, créer le dossier cible (le script fait « cd ~/qaia », alors que les autres
#      projets vivent sous /home/pi/sites/) avec son .env et un compose qui référence l'image
#      GHCR : celui du dépôt construit « qaia:local », que « docker compose pull » ne sait
#      pas tirer. Si le paquet GHCR reste privé, « docker login ghcr.io » sur le Pi ;
#   3. lancer ce workflow à la main (onglet Actions) et vérifier qu'il passe ;
#   4. remettre le déclencheur automatique sous « on: » :
#        push:
#          branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      # Actions passées sous Node 24 le 25/09/2026 (Node 20 disparaît des runners) :
      # checkout v4 → v5, setup-qemu v3 → v4, setup-buildx v3 → v4, login v3 → v4,
      # build-push v6 → v7.
      - uses: actions/checkout@v5
      # GHCR exige un nom en minuscules : ghcr.io/${{ github.repository }} donnait
      # « ghcr.io/gchuinard/gotyeah-QAIA:latest », refusé au build (« repository name must
      # be lowercase », 30/06/2026). On le calcule donc en minuscules ici.
      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}

      - name: Vérifier que l'empreinte du Pi est configurée
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          if [ -z "$SSH_HOST_FINGERPRINT" ]; then
            echo "::error::Secret SSH_HOST_FINGERPRINT absent : sans lui, le déploiement accepterait n'importe quel hôte."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1, soit v1.2.5 au 24/09/2026
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Sans empreinte, l'action accepte n'importe quel hôte : l'étape précédente l'exige.
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            cd ~/qaia
            docker compose pull
            docker compose up -d
