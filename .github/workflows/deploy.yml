# Cross-build the arm64 image, push to GHCR, then SSH-deploy to the Pi.
# Configure first: a protected "production" Environment with secrets
#   SSH_HOST, SSH_USER, SSH_KEY (deploy-only key), and SSH_KNOWN_HOSTS.
# Networking to a homelab Pi is a DEFERRED decision (PLAN §13) — e.g. Tailscale.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_KNOWN_HOSTS }}
          script: |
            cd ~/qaia
            docker compose pull
            docker compose up -d
