name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run --with allure-pytest pytest --alluredir=allure-results
      - name: Push Allure results
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: gchuinard/gotyeah-allure/actions/push-allure-results@main
        with:
          site: gotyeah-QAIA
          results-dir: allure-results
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
